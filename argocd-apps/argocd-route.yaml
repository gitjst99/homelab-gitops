# HTTPRoute exposing the Argo CD UI at argocd.dev.home.arpa.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-route
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/gitjst99/homelab-gitops.git
    targetRevision: main
    path: infrastructure/argocd-route
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
