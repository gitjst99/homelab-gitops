apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-api-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_GITHUB_USER/homelab-gitops.git
    targetRevision: main
    path: apps/hello-api/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: hello-api-dev
  syncPolicy:
    automated: # dev deploys itself whenever Git changes
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
